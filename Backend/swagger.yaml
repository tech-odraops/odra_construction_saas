openapi: 3.0.3
info:
  title: Odra Construction SaaS Backend API
  version: 1.0.0
  description: |
    OpenAPI documentation for the HTTP routes mounted by Backend/index.js.
    JSON request bodies are expected unless a route says multipart/form-data.
    IDs are MongoDB ObjectId strings. Authenticated endpoints use the JWT
    returned by the login/signup endpoints as a Bearer token.

    The Socket.IO events implemented by the backend are listed in the
    x-socket-io extension below; they are not HTTP endpoints.
servers:
  - url: http://localhost:8080
    description: Local backend default
tags:
  - name: Health
  - name: Authentication
  - name: Projects
  - name: Reports
  - name: Attendance
  - name: Chat
  - name: Workers
  - name: Inventory
  - name: Admin
  - name: Notifications
  - name: Contact
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        '200':
          description: Server is healthy.
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /ping:
    get:
      tags: [Health]
      summary: Ping
      security: []
      responses:
        '200':
          description: Server responded.
          content:
            text/plain:
              schema:
                type: string
                example: OK
  /auth/signUp:
    post:
      tags: [Authentication]
      summary: Register a manager and create their organization
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name, password]
              properties:
                email:
                  type: string
                  format: email
                name:
                  type: string
                password:
                  type: string
                  minLength: 8
                  description: At least one letter and one number; spaces are not allowed.
      responses:
        '200':
          description: Account and organization created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  token: { type: string }
                  User_id: { type: string }
                  role: { type: string, example: manager }
                  name: { type: string }
        '409':
          description: User already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/signIn:
    post:
      tags: [Authentication]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, role]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                role:
                  type: string
                  enum: [manager, site engineer]
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  token: { type: string }
                  User_id: { type: string }
                  role: { type: string }
                  name: { type: string }
        '401':
          description: Password or role does not match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/google:
    post:
      tags: [Authentication]
      summary: Authenticate an existing account through Google OAuth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: Google authorization code }
                origin: { type: string, format: uri, description: Optional redirect URI }
      responses:
        '200':
          description: Authentication result; a missing local user returns success false and redirect /Signup.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  success: { type: boolean }
                  token: { type: string }
                  User_id: { type: string }
                  role: { type: string }
                  name: { type: string }
                  redirect: { type: string }
                  error: { type: string }
        '400':
          description: Authorization code missing or Google token invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/activate-account:
    post:
      tags: [Authentication]
      summary: Activate an invited account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password:
                  type: string
                  minLength: 8
                  description: At least one letter and one number; spaces are not allowed.
      responses:
        '200':
          description: Account activated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Missing or invalid fields, or invitation invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/change-password:
    patch:
      tags: [Authentication]
      summary: Change the authenticated user's password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword:
                  type: string
                  minLength: 8
                  description: At least one letter and one number; spaces are not allowed.
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Invalid current or new password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication missing or active account not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/forgot-password:
    post:
      tags: [Authentication]
      summary: Request password reset instructions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Generic response returned whether or not the account exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Email is missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/reset-password:
    post:
      tags: [Authentication]
      summary: Reset password using a reset token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token: { type: string }
                newPassword:
                  type: string
                  minLength: 8
                  description: At least one letter and one number; spaces are not allowed.
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Invalid input, or reset token invalid, expired, or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /contact-us:
    post:
      tags: [Contact]
      summary: Submit a contact-us message
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, message]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                message: { type: string }
      responses:
        '200':
          description: Message stored and notification email sent.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Message received successfully }
        '400':
          description: Request validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects:
    post:
      tags: [Projects]
      summary: Create a project and assign a site engineer
      description: Manager only. If no matching site engineer exists in the organization, one is created from the supplied engineer details.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, description, siteEngineerEmail]
              properties:
                title: { type: string }
                description: { type: string }
                startDate: { type: string, format: date-time }
                endDate: { type: string, format: date-time }
                siteEngineerEmail: { type: string, format: email }
                siteEngineerName: { type: string }
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  newProject: { $ref: '#/components/schemas/Project' }
                  contractorName: { type: string }
        '403':
          description: Site engineer belongs to a different organization.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Required fields missing or contractor not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Projects]
      summary: List projects for the manager's organization
      description: Manager only.
      responses:
        '200':
          description: Project list; projects is empty when no projects exist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  message: { type: string }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/my-projects:
    get:
      tags: [Projects]
      summary: List projects assigned to the site engineer
      description: Site engineer only.
      responses:
        '200':
          description: Assigned projects, or an empty list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  projects:
                    type: array
                    items: { $ref: '#/components/schemas/Project' }
                  message: { type: string }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/dashboard:
    get:
      tags: [Projects]
      summary: Get organization project dashboard totals
      description: Manager only.
      responses:
        '200':
          description: Project counts and up to five recent projects.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  totalProjects: { type: integer }
                  ongoingProjects: { type: integer }
                  completedProjects: { type: integer }
                  recentProjects:
                    type: array
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        status: { type: string, enum: [Ongoing, Completed] }
                        createdAt: { type: string, format: date-time }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Projects]
      summary: Get project details and reports
      description: Manager or site engineer.
      responses:
        '200':
          description: Project document populated with contractor, site engineer, and reports.
          content:
            application/json:
              schema:
                type: object
                properties:
                  project: { $ref: '#/components/schemas/Project' }
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Projects]
      summary: Delete a project and related records
      description: Manager only.
      responses:
        '200':
          description: Project deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{projectId}/complete:
    parameters:
      - $ref: '#/components/parameters/projectId'
    post:
      tags: [Projects]
      summary: Mark a project completed
      description: Manager only. Request body is not used.
      responses:
        '200':
          description: Project completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Project is already completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized to complete this project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{projectId}/wages:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [Projects]
      summary: Calculate project worker wages
      description: Manager only.
      responses:
        '200':
          description: Worker wages and project total.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      workers:
                        type: array
                        items:
                          type: object
                          properties:
                            workerId: { type: string }
                            name: { type: string }
                            payoutType: { type: string, enum: [daily, monthly] }
                            totalWage: { type: number }
                      totalProjectWage: { type: number }
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{projectId}/miscellaneous:
    parameters:
      - $ref: '#/components/parameters/projectId'
    post:
      tags: [Projects]
      summary: Add a miscellaneous project expense
      description: Site engineer only. totalCost and initial status are calculated/set by the backend.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemName, purchaseDate, unit, quantity, pricePerUnit]
              properties:
                itemName: { type: string }
                purchaseDate: { type: string, format: date }
                unit: { type: string }
                quantity: { type: number }
                pricePerUnit: { type: number }
      responses:
        '201':
          description: Expense added; data contains the project's miscellaneousItems array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MiscellaneousItem' }
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{projectId}/miscellaneous/{itemId}/status:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - name: itemId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Projects]
      summary: Approve or reject a miscellaneous expense
      description: Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [Approved, Rejected] }
                rejectionReason: { type: string }
      responses:
        '200':
          description: Expense status updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  data: { $ref: '#/components/schemas/MiscellaneousItem' }
        '404':
          description: Project or item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /projects/{projectId}/title:
    parameters:
      - $ref: '#/components/parameters/projectId'
    patch:
      tags: [Projects]
      summary: Update project title
      description: Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        '200':
          description: Project title updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  project: { $ref: '#/components/schemas/Project' }
        '400':
          description: Title is missing or blank.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reports:
    post:
      tags: [Reports]
      summary: Submit a daily project report
      description: Site engineer assigned to the project only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, workDone]
              properties:
                projectId: { type: string }
                workDone: { type: string }
                issuesFound: { type: string }
                images:
                  type: array
                  items: { type: string, format: uri }
      responses:
        '201':
          description: Report created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  report: { $ref: '#/components/schemas/Report' }
                  message: { type: string, example: Report Created Successfully }
        '400':
          description: Project is completed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Site engineer is not assigned to the project.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reports/{reportId}/review:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Reports]
      summary: Review a report
      description: Manager only. contractorStatus is applied only when it is approved, declined, or pending.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contractorStatus: { type: string, enum: [approved, declined, pending] }
                contractorComment: { type: string }
      responses:
        '202':
          description: Review saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '404':
          description: Report not found or reviewer is not authorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reports/{reportId}/ai-summary:
    parameters:
      - name: reportId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Reports]
      summary: Generate an AI summary for a report
      description: Manager only. Request body is not used.
      responses:
        '200':
          description: Summary generated and saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  aiSummary:
                    type: object
                    properties:
                      workCompletedSummary: { type: string }
                      issuesSummary: { type: string }
                      overallStatus: { type: string }
        '404':
          description: Report not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reports/voice-to-text:
    post:
      tags: [Reports]
      summary: Transcribe uploaded audio and structure a report draft
      description: Authenticated user. Upload a single audio file with the form field name audio.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
      responses:
        '200':
          description: Audio transcript and extracted report fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  transcript: { type: string }
                  structuredData:
                    type: object
                    properties:
                      workDone: { type: string }
                      issuesFound: { type: string }
        '400':
          description: No audio uploaded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /reports/{id}:
    parameters:
      - $ref: '#/components/parameters/id'
    get:
      tags: [Reports]
      summary: Get a report
      description: Manager only.
      responses:
        '200':
          description: Report with populated project and site engineer.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string }
                  report: { $ref: '#/components/schemas/Report' }
        '404':
          description: Report not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /attendance/workers/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [Attendance]
      summary: List assigned workers for attendance entry
      description: Site engineer only.
      responses:
        '200':
          description: Workers assigned to the project.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  workers:
                    type: array
                    items: { $ref: '#/components/schemas/Worker' }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /attendance/mark:
    post:
      tags: [Attendance]
      summary: Mark or replace attendance for a project date
      description: Site engineer only. The record is upserted for the project/date.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, date, records]
              properties:
                projectId: { type: string }
                date: { type: string, description: Date key stored by the backend, for example 2026-10-17 }
                records:
                  type: array
                  items:
                    type: object
                    required: [workerId, status]
                    properties:
                      workerId: { type: string }
                      status: { type: string, enum: [absent, present] }
      responses:
        '201':
          description: Attendance saved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  attendance: { $ref: '#/components/schemas/Attendance' }
        '400':
          description: Project completed, worker not assigned to project, or worker is free.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project or worker not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /attendance/{projectId}/{date}:
    parameters:
      - $ref: '#/components/parameters/projectId'
      - name: date
        in: path
        required: true
        description: Date key matching the value used when marking attendance.
        schema: { type: string }
    get:
      tags: [Attendance]
      summary: Get attendance for a project and date
      description: Site engineer or manager.
      responses:
        '200':
          description: Attendance document, or an empty records array if none exists for that date.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  attendance: { $ref: '#/components/schemas/Attendance' }
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /chat/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [Chat]
      summary: Get project chat messages
      description: Manager or site engineer. Messages are returned in chronological order within the selected page.
      parameters:
        - name: page
          in: query
          description: Zero-based page index.
          schema: { type: integer, default: 0, minimum: 0 }
        - name: limit
          in: query
          description: Number of messages per page.
          schema: { type: integer, default: 20, minimum: 1 }
      responses:
        '200':
          description: Chat messages.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  chats:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
                  message: { type: string }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /chat/{projectId}/unread:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [Chat]
      summary: Get unread chat message count
      description: Manager or site engineer.
      responses:
        '200':
          description: Unread count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  count: { type: integer }
                  message: { type: string }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /chat/{projectId}/read:
    parameters:
      - $ref: '#/components/parameters/projectId'
    post:
      tags: [Chat]
      summary: Mark other participants' project messages as read
      description: Manager or site engineer. Request body is not used.
      responses:
        '200':
          description: Messages marked read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workers:
    post:
      tags: [Workers]
      summary: Create a worker
      description: Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                phone: { type: string }
                dailyWage: { type: number }
                payoutType: { type: string, enum: [daily, monthly], default: daily }
      responses:
        '201':
          description: Worker created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  worker: { $ref: '#/components/schemas/Worker' }
        '400':
          description: Worker name is required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Workers]
      summary: List workers created by the manager
      description: Manager only.
      responses:
        '200':
          description: Workers and their populated current project, if assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  workers:
                    type: array
                    items: { $ref: '#/components/schemas/Worker' }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workers/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [Workers]
      summary: List workers assigned to a project
      description: Manager or site engineer.
      responses:
        '200':
          description: Assigned workers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  workers:
                    type: array
                    items: { $ref: '#/components/schemas/Worker' }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /workers/{workerId}/assign:
    parameters:
      - name: workerId
        in: path
        required: true
        schema: { type: string }
    post:
      tags: [Workers]
      summary: Assign a worker to a project
      description: Manager only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId]
              properties:
                projectId: { type: string }
      responses:
        '200':
          description: Worker assigned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Project completed or worker is not free.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project or worker not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /inventory/summary/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [Inventory]
      summary: Get inventory cost summary
      description: Manager only.
      responses:
        '200':
          description: Purchase, usage, and remaining-stock values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  totalPurchasedValue: { type: number }
                  totalUsedCost: { type: number }
                  remainingStockValue: { type: number }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /inventory/history/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [Inventory]
      summary: Get inventory usage history
      description: Manager only.
      responses:
        '200':
          description: Usage history with populated item and user data.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryUsage' }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /inventory/usage:
    post:
      tags: [Inventory]
      summary: Record inventory material usage
      description: Site engineer only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [projectId, inventoryItemId, usedQty, date]
              properties:
                projectId: { type: string }
                inventoryItemId: { type: string }
                usedQty: { type: number }
                date: { type: string, format: date }
      responses:
        '201':
          description: Usage recorded and stock deducted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: Required value missing, project completed, or quantity exceeds available stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project or inventory item not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /inventory/purchase-history/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    get:
      tags: [Inventory]
      summary: Get inventory purchase history
      description: Manager only.
      responses:
        '200':
          description: Purchase history with populated item and creator.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  history:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryPurchase' }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /inventory/{projectId}:
    parameters:
      - $ref: '#/components/parameters/projectId'
    post:
      tags: [Inventory]
      summary: Add or replenish a project inventory item
      description: Manager or site engineer. A purchase record is created for each call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, unit, quantity, purchaseDate]
              properties:
                name: { type: string }
                unit: { type: string }
                quantity: { type: number }
                pricePerUnit: { type: number }
                supplierName: { type: string }
                companyName: { type: string }
                purchaseDate: { type: string, format: date }
      responses:
        '200':
          description: Inventory item added or replenished.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  item: { $ref: '#/components/schemas/InventoryItem' }
        '400':
          description: Required field missing or project inventory locked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      tags: [Inventory]
      summary: Get project inventory
      description: Manager or site engineer. Each item includes an isLowStock flag.
      responses:
        '200':
          description: Project inventory items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  items:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/InventoryItem'
                        - type: object
                          properties:
                            isLowStock: { type: boolean }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/login:
    post:
      tags: [Admin]
      summary: Sign in as an administrator
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Admin signed in.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  token: { type: string }
                  role: { type: string, example: admin }
                  name: { type: string }
        '401':
          description: Invalid admin credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/dashboard:
    get:
      tags: [Admin]
      summary: Get admin dashboard totals
      description: Admin role only.
      responses:
        '200':
          description: Total user and organization counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  totalUsers: { type: integer }
                  totalOrganizations: { type: integer }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /admin/user-growth:
    get:
      tags: [Admin]
      summary: Get user growth grouped by month
      description: Admin role only. Months are Jan through Dec.
      responses:
        '200':
          description: User counts by calendar month.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        month: { type: string }
                        users: { type: integer }
        '500':
          $ref: '#/components/responses/InternalServerError'
  /token/me:
    get:
      tags: [Authentication]
      summary: Validate the current bearer token
      responses:
        '200':
          description: Token is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: Token is valid }
                  role: { type: string }
                  User_id: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
  /notification/fcm-token:
    post:
      tags: [Notifications]
      summary: Save the authenticated user's Firebase Cloud Messaging token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fcmToken]
              properties:
                fcmToken: { type: string }
      responses:
        '200':
          description: FCM token saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessMessage'
        '400':
          description: FCM token is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
  schemas:
    SuccessMessage:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        message: { type: string }
    ValidationErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
    Project:
      type: object
      description: Project document; populated relationship fields vary by endpoint.
      additionalProperties: true
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [Ongoing, Completed] }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        contractor: { oneOf: [{ type: string }, { type: object }] }
        siteEngineer: { oneOf: [{ type: string }, { type: object }] }
        reports:
          type: array
          items: { oneOf: [{ type: string }, { $ref: '#/components/schemas/Report' }] }
        miscellaneousItems:
          type: array
          items: { $ref: '#/components/schemas/MiscellaneousItem' }
    MiscellaneousItem:
      type: object
      properties:
        _id: { type: string }
        itemName: { type: string }
        purchaseDate: { type: string, format: date-time }
        unit: { type: string }
        quantity: { type: number }
        pricePerUnit: { type: number }
        totalCost: { type: number }
        status: { type: string, enum: [Pending, Approved, Rejected] }
        rejectionReason: { type: string }
        createdBy: { type: string }
    Report:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        projectId: { oneOf: [{ type: string }, { type: object }] }
        siteEngineerId: { oneOf: [{ type: string }, { type: object }] }
        workDone: { type: string }
        issuesFound: { type: string }
        images:
          type: array
          items: { type: string }
        contractorStatus: { type: string, enum: [approved, declined, pending] }
        contractorComment: { type: string }
        aiSummary: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    Worker:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        name: { type: string }
        phone: { type: string }
        dailyWage: { type: number }
        payoutType: { type: string, enum: [daily, monthly] }
        currentProjectId:
          oneOf:
            - type: string
            - type: object
          nullable: true
        status: { type: string, enum: [free, assigned] }
    Attendance:
      type: object
      additionalProperties: true
      properties:
        projectId: { oneOf: [{ type: string }, { type: object }] }
        date: { type: string }
        records:
          type: array
          items:
            type: object
            properties:
              workerId: { oneOf: [{ type: string }, { type: object }] }
              status: { type: string, enum: [absent, present] }
    ChatMessage:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        projectId: { type: string }
        senderId: { oneOf: [{ type: string }, { type: object }] }
        message: { type: string }
        readBy:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    InventoryItem:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        projectId: { oneOf: [{ type: string }, { type: object }] }
        name: { type: string }
        unit: { type: string }
        supplierName: { type: string }
        companyName: { type: string }
        pricePerUnit: { type: number }
        totalQuantity: { type: number }
        availableQuantity: { type: number }
        isLowStock: { type: boolean }
    InventoryUsage:
      type: object
      additionalProperties: true
      properties:
        projectId: { type: string }
        inventoryItemId: { oneOf: [{ type: string }, { type: object }] }
        usedQty: { type: number }
        costAtThatTime: { type: number }
        date: { type: string }
    InventoryPurchase:
      type: object
      additionalProperties: true
      properties:
        projectId: { type: string }
        inventoryItemId: { oneOf: [{ type: string }, { type: object }] }
        purchaseDate: { type: string, format: date-time }
        quantity: { type: number }
        pricePerUnit: { type: number }
        supplierName: { type: string }
        companyName: { type: string }
  responses:
    InternalServerError:
      description: An internal server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
x-socket-io:
  description: |
    Socket.IO protocol events are not HTTP routes and cannot be invoked through
    the Swagger UI. The backend accepts the following client events and emits
    these server events.
  clientEvents:
    join:
      payload:
        contractorId: { type: string }
        projectId: { type: string }
        siteEngineerId: { type: string }
        organizationId: { type: string }
        isChat: { type: boolean }
    leave:
      payload:
        contractorId: { type: string }
        projectId: { type: string }
        siteEngineerId: { type: string }
    chat:new:
      payload:
        projectId: { type: string }
        senderId: { type: string }
        message: { type: string }
  serverEvents:
    - project:assigned
    - project:completed
    - project:deleted
    - project:titleUpdated
    - chat:new
    - chat:error
    - report:new
    - report:reviewed
    - attendance:updated
    - misc:new
    - misc:updated
    - inventory:item-added
    - inventory:updated
