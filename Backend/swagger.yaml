openapi: 3.0.3
info:
  title: Odra Construction SaaS Backend API
  version: 1.0.0
  description: |
    OpenAPI documentation for the HTTP routes mounted by Backend/index.js.
    JSON request bodies are expected unless a route says multipart/form-data.
    IDs are MongoDB ObjectId strings. Authenticated endpoints use the JWT
    that the login endpoints set as an HTTP-only cookie (`odra_auth` by
    default). Sign in from this page first; the browser then sends the cookie
    automatically. State-changing requests must come from an allowed origin.

    The Socket.IO events implemented by the backend are listed in the
    x-socket-io extension below; they are not HTTP endpoints.
servers:
  - url: http://localhost:8080
    description: Local backend default
tags:
  - name: Health
  - name: Authentication
  - name: Projects
  - name: Reports
  - name: Attendance
  - name: Chat
  - name: Workers
  - name: Inventory
  - name: Admin
  - name: Notifications
  - name: Contact
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: odra_auth
  parameters:
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    projectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
  schemas:
    SuccessMessage:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string }
    ErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error: { type: string }
        message: { type: string }
    ValidationErrorResponse:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
    Project:
      type: object
      description: Project document; populated relationship fields vary by endpoint.
      additionalProperties: true
      properties:
        _id: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [Ongoing, Completed] }
        startDate: { type: string, format: date-time }
        endDate: { type: string, format: date-time }
        contractor: { oneOf: [{ type: string }, { type: object }] }
        siteEngineer: { oneOf: [{ type: string }, { type: object }] }
        reports:
          type: array
          items: { oneOf: [{ type: string }, { $ref: '#/components/schemas/Report' }] }
        miscellaneousItems:
          type: array
          items: { $ref: '#/components/schemas/MiscellaneousItem' }
    MiscellaneousItem:
      type: object
      properties:
        _id: { type: string }
        itemName: { type: string }
        purchaseDate: { type: string, format: date-time }
        unit: { type: string }
        quantity: { type: number }
        pricePerUnit: { type: number }
        totalCost: { type: number }
        status: { type: string, enum: [Pending, Approved, Rejected] }
        rejectionReason: { type: string }
        createdBy: { type: string }
    Report:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        projectId: { oneOf: [{ type: string }, { type: object }] }
        siteEngineerId: { oneOf: [{ type: string }, { type: object }] }
        workDone: { type: string }
        issuesFound: { type: string }
        images:
          type: array
          items: { type: string }
        contractorStatus: { type: string, enum: [approved, declined, pending] }
        contractorComment: { type: string }
        aiSummary: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }
    Worker:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        name: { type: string }
        phone: { type: string }
        dailyWage: { type: number }
        payoutType: { type: string, enum: [daily, monthly] }
        currentProjectId:
          oneOf:
            - type: string
            - type: object
          nullable: true
        status: { type: string, enum: [free, assigned] }
    Attendance:
      type: object
      additionalProperties: true
      properties:
        projectId: { oneOf: [{ type: string }, { type: object }] }
        date: { type: string }
        records:
          type: array
          items:
            type: object
            properties:
              workerId: { oneOf: [{ type: string }, { type: object }] }
              status: { type: string, enum: [absent, present] }
    ChatMessage:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        projectId: { type: string }
        senderId: { oneOf: [{ type: string }, { type: object }] }
        message: { type: string }
        readBy:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
    InventoryItem:
      type: object
      additionalProperties: true
      properties:
        _id: { type: string }
        projectId: { oneOf: [{ type: string }, { type: object }] }
        locationId: { oneOf: [{ type: string }, { type: object }] }
        materialId: { oneOf: [{ type: string }, { type: object }] }
        name: { type: string }
        unit: { type: string }
        supplierName: { type: string }
        companyName: { type: string }
        pricePerUnit: { type: number }
        totalQuantity: { type: number }
        availableQuantity: { type: number }
        isLowStock: { type: boolean }
        totalPurchasedValue: { type: number }
        transferredInValue: { type: number }
        totalUsedCost: { type: number }
        remainingStockValue: { type: number }
    InventoryUsage:
      type: object
      additionalProperties: true
      properties:
        projectId: { type: string }
        locationId: { type: string }
        materialId: { type: string }
        inventoryItemId: { oneOf: [{ type: string }, { type: object }] }
        usedQty: { type: number }
        costAtThatTime: { type: number }
        date: { type: string }
        comment: { type: string, maxLength: 1000 }
    InventoryPurchase:
      type: object
      additionalProperties: true
      properties:
        projectId: { type: string }
        locationId: { type: string }
        materialId: { type: string }
        purchaseOrderId: { type: string }
        goodsReceiptId: { type: string }
        inventoryItemId: { oneOf: [{ type: string }, { type: object }] }
        purchaseDate: { type: string, format: date-time }
        quantity: { type: number }
        pricePerUnit: { type: number }
        supplierName: { type: string }
        companyName: { type: string }
        comment: { type: string, maxLength: 1000 }
    InventoryMaterial:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        category: { type: string }
        unit: { type: string }
        specifications: { type: object, additionalProperties: true }
        isActive: { type: boolean }
    InventoryLocation:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        type: { type: string, enum: [project_site, warehouse] }
        projectId: { type: string, nullable: true }
        code: { type: string }
        address: { type: string }
        isActive: { type: boolean }
    InventoryIndent:
      type: object
      properties:
        _id: { type: string }
        locationId: { type: string }
        status:
          type: string
          enum: [submitted, sourcing, partially_fulfilled, fulfilled, rejected, cancelled]
        requiredDate: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            properties:
              materialId: { type: string }
              materialName: { type: string }
              unit: { type: string }
              requestedQuantity: { type: number }
              fulfilledQuantity: { type: number }
              allocatedQuantity: { type: number }
    InventoryTransfer:
      type: object
      properties:
        _id: { type: string }
        sourceLocationId: { type: string }
        destinationLocationId: { type: string }
        status:
          type: string
          enum: [requested, approved, in_transit, partially_received, received, rejected, cancelled]
        items:
          type: array
          items:
            type: object
            properties:
              materialId: { type: string }
              requestedQuantity: { type: number }
              dispatchedQuantity: { type: number }
              receivedQuantity: { type: number }
              unitCost: { type: number }
    InventoryVendor:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        contactName: { type: string }
        email: { type: string }
        phone: { type: string }
        taxId: { type: string }
        address: { type: string }
        isActive: { type: boolean }
    InventoryPurchaseOrder:
      type: object
      properties:
        _id: { type: string }
        indentId: { type: string }
        locationId: { type: string }
        vendorId: { type: string }
        status: { type: string, enum: [issued, partially_received, received, cancelled] }
        deliveryDate: { type: string, format: date }
        subtotal: { type: number }
        taxAmount: { type: number }
        shippingCost: { type: number }
        totalAmount: { type: number }
    InventoryGoodsReceipt:
      type: object
      properties:
        _id: { type: string }
        purchaseOrderId: { type: string }
        locationId: { type: string }
        receivedDate: { type: string, format: date }
        items:
          type: array
          items:
            type: object
            properties:
              materialId: { type: string }
              receivedQuantity: { type: number }
              unitPrice: { type: number }
  responses:
    InternalServerError:
      description: An internal server error occurred.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing, invalid, or expired authentication cookie.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
x-socket-io:
  description: |
    Socket.IO protocol events are not HTTP routes and cannot be invoked through
    the Swagger UI. The backend accepts the following client events and emits
    these server events.
  clientEvents:
    join:
      payload:
        contractorId: { type: string }
        projectId: { type: string }
        siteEngineerId: { type: string }
        organizationId: { type: string }
        isChat: { type: boolean }
    leave:
      payload:
        contractorId: { type: string }
        projectId: { type: string }
        siteEngineerId: { type: string }
    chat:new:
      payload:
        projectId: { type: string }
        senderId: { type: string }
        message: { type: string }
  serverEvents:
    - project:assigned
    - project:completed
    - project:deleted
    - project:titleUpdated
    - chat:new
    - chat:error
    - report:new
    - report:reviewed
    - attendance:updated
    - misc:new
    - misc:updated
    - inventory:item-added
    - inventory:updated
